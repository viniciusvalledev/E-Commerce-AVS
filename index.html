<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVS &copy;</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="%%FAVICON_PATH%%/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="%%FAVICON_PATH%%/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="%%FAVICON_PATH%%/favicon-16x16.png">
  <link rel="manifest" href="%%FAVICON_PATH%%/site.webmanifest">
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <header id="header-placeholder"></header>

  <main class="main-content main-full-height">
    <div class="home-splash-container">
      <div class="home-splash-content">
        
        <h1>AVS</h1>
        
        <p class="home-splash-subtitle">The new era of StreetWear</p>
        
        <p class="home-splash-subtitle drop-available">drop 1 now available</p>
        
        <a href="pages/shop.html" class="btn btn-primary btn-icon">
          ENTRAR NA LOJA
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>

        <div class="countdown-timer">
          <h3 class="countdown-title">PRÓXIMO DROP EM:</h3>
          
          <div id="timer" class="timer-grid">
            <div class="timer-box">
              <span id="days">00</span>
              <span class="timer-label">Dias</span>
            </div>
            <div class="timer-box">
              <span id="hours">00</span>
              <span class="timer-label">Horas</span>
            </div>
            <div class="timer-box">
              <span id="minutes">00</span>
              <span class="timer-label">Minutos</span>
            </div>
            <div class="timer-box">
              <span id="seconds">00</span>
              <span class="timer-label">Segundos</span>
            </div>
          </div>
        </div>
        </div>
    </div>
  </main>

  <footer id="footer-placeholder"></footer>

  <div id="cart-drawer-placeholder"></div>
  <div id="menu-overlay-placeholder"></div>

  <script src="scripts/cart.js"></script>
  <script src="scripts/main.js"></script>
  
  <script>
    
    // --- ⚠️ EDITE A DATA DO PRÓXIMO DROP AQUI ⚠️ ---
    // Formato: "Mês Dia, Ano HH:MM:SS" (em inglês)
    // Exemplo: "December 25, 2025 10:00:00"
    const proximoDrop = "NOVEMBER 1, 2025 10:00:00";
    // ---------------------------------

    const nextDropDate = new Date(proximoDrop).getTime();

    // Pega os elementos do HTML
    const elDays = document.getElementById('days');
    const elHours = document.getElementById('hours');
    const elMinutes = document.getElementById('minutes');
    const elSeconds = document.getElementById('seconds');
    const elTimer = document.getElementById('timer');
    const elCountdownTitle = document.querySelector('.countdown-title');

    // Função que atualiza o relógio
    function updateTimer() {
      const agora = new Date().getTime();
      const distancia = nextDropDate - agora;

      // Se a data já passou
      if (distancia < 0) {
        clearInterval(timerInterval);
        elTimer.style.display = 'none'; // Esconde o relógio
        elCountdownTitle.innerHTML = "DROP 1 IS AVAILABLE"; // Muda a msg
        return;
      }

      // Calcula o tempo
      const days = Math.floor(distancia / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distancia % (1000 * 60)) / 1000);

      // Adiciona um zero à esquerda se for menor que 10
      elDays.innerText = days.toString().padStart(2, '0');
      elHours.innerText = hours.toString().padStart(2, '0');
      elMinutes.innerText = minutes.toString().padStart(2, '0');
      elSeconds.innerText = seconds.toString().padStart(2, '0');
    }

    // Roda a função a cada 1 segundo
    const timerInterval = setInterval(updateTimer, 1000);
    
    // Roda uma vez imediatamente para não piscar
    updateTimer(); 

  </script>
  
</body>
</html>
